services:
  db:
    build:
      dockerfile: Dockerfile_postgres
      context: '.'
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    environment:
      HOST: 'db'
      POSTGRES_PASSWORD: '123456'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./restore_db.sh:/docker-entrypoint-initdb.d/restore_db.sh

  redis:
    image: redis
    volumes:
      - redis_data:/data
    env_file:
      - ./.env
    ports:
      - "6379:6379"
  web:
    build:
      dockerfile: Dockerfile_python
      context: '.'
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - ./media/static:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    environment:
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_BACKEND: "redis://redis:6379/0"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    build:
      dockerfile: Dockerfile_nginx
      context: '.'
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./media/static:/app/staticfiles
    depends on:
      - web

volumes:
  postgres_data:
  static:
  redis_data: